spring:
  application:
    name: api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  structured:
    format:
      console: ecs
