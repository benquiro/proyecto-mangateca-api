spring:
  application:
    name: api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    error:
      include-stacktrace: never
      include-message: never
      include-binding-errors: never
  flyway:
    validate-on-migrate: true
    clean-disabled: true
    # Lista vacia (forma [], verificada con SchemaDriftIT caso 2): Flyway ignora por defecto
    # '*:future', y una migracion aplicada que no existe localmente no haria fallar el arranque.
    ignore-migration-patterns: []
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: false

mangateca:
  identity:
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    refresh-cookie:
      same-site: Strict

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      show-components: always
  info:
    env:
      enabled: false
    java:
      enabled: false
    os:
      enabled: false
    git:
      enabled: false

logging:
  level:
    # Hibernate registra el "Detail: Key (lower(email::text))=(...)" de PostgreSQL al violar
    # users_email_lower_uk, exponiendo el correo en claro (FR-002, R14). Se silencia ese logger.
    org.hibernate.orm.jdbc.error: "OFF"
  structured:
    format:
      console: ecs
